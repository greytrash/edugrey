<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>El Juego · Carreteras Dalinianas</title>
<style>
    body {
        background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
        font-family: 'Courier New', 'Segoe UI', monospace;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        margin: 0;
    }

    /* Contenedor principal estilo consola */
    .game-console {
        max-width: 800px;
        width: 100%;
        background: #0a0c15;
        border-radius: 32px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        overflow: hidden;
        border: 1px solid #2a2e3f;
    }

    /* Pantalla estilo CRT */
    .screen {
        background: #03050a;
        padding: 20px;
        color: #b7f9e2;
        text-shadow: 0 0 3px #0affb0;
        border-bottom: 3px solid #1f2a3e;
    }

    .stats-panel {
        background: #0e111c;
        padding: 12px 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        justify-content: space-between;
        border-bottom: 1px solid #23283c;
        font-size: 0.8rem;
    }

    .stats-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
    }

    .stat-badge {
        background: #151c2a;
        padding: 4px 8px;
        border-radius: 20px;
        color: #d1d9ff;
        font-weight: bold;
    }

    .stat-badge span {
        color: #ffb347;
    }

    .relato-box {
        background: #0b0e18;
        padding: 6px 12px;
        border-radius: 20px;
        border-left: 4px solid #ffb347;
    }

    /* Zona de historia */
    .story-box {
        background: #07090f;
        border-radius: 20px;
        padding: 20px;
        margin: 15px 0;
        min-height: 280px;
        box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }

    .story-text p {
        margin: 12px 0;
        line-height: 1.5;
        font-size: 1rem;
    }

    .dialogue {
        background: #0e1320;
        padding: 10px;
        margin: 10px 0;
        border-radius: 16px;
        border-left: 4px solid #3c6e71;
    }

    .ending-tag {
        background: #3b1e2c;
        color: #ffb3b3;
        padding: 10px;
        border-radius: 12px;
        text-align: center;
    }

    /* Panel de mandos (gamepad) */
    .gamepad {
        background: #11141f;
        padding: 25px 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .buttons-row {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
    }

    .action-btn {
        background: #1e243b;
        border: none;
        font-family: monospace;
        font-size: 2rem;
        font-weight: bold;
        padding: 15px 25px;
        min-width: 100px;
        border-radius: 60px;
        color: white;
        cursor: pointer;
        box-shadow: 0 5px 0 #0a0c14;
        transition: 0.05s linear;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .action-btn:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #0a0c14;
    }

    .action-btn.special {
        background: #2a2e4a;
        color: #ffd966;
        font-size: 1rem;
    }

    .action-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        transform: none;
        box-shadow: 0 5px 0 #0a0c14;
    }

    .system-bar {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 10px;
    }

    .sys-btn {
        background: #191e2e;
        border: none;
        font-family: monospace;
        padding: 8px 16px;
        border-radius: 40px;
        color: #aaa;
        cursor: pointer;
        font-weight: bold;
    }

    .sys-btn:hover {
        background: #252d42;
        color: #fff;
    }

    .event-log {
        background: #05070c;
        border-radius: 16px;
        padding: 12px;
        font-size: 0.7rem;
        color: #6f8f8f;
        max-height: 100px;
        overflow-y: auto;
    }

    h2 {
        color: #ffcf8a;
        font-size: 1.4rem;
        margin-top: 0;
    }

    hr {
        border-color: #23283c;
    }

    /* Choice buttons */
    .choices {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 15px;
    }

    .choice-btn {
        background: #131929;
        border: 1px solid #2a3350;
        font-family: monospace;
        font-size: 0.9rem;
        padding: 12px 18px;
        border-radius: 12px;
        color: #c4d4ff;
        cursor: pointer;
        text-align: left;
        transition: 0.1s;
    }

    .choice-btn:hover {
        background: #1a2236;
        border-color: #4a6090;
        color: #fff;
    }

    .choice-btn:active {
        transform: translateY(1px);
    }

    /* Toast notification */
    .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: #1e2a40;
        color: #b7f9e2;
        padding: 10px 22px;
        border-radius: 30px;
        font-family: monospace;
        font-size: 0.85rem;
        border: 1px solid #2e4060;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        z-index: 100;
    }

    .toast.show {
        opacity: 1;
    }
</style>
</head>
<body>

<div class="game-console">

    <!-- Pantalla CRT -->
    <div class="screen">
        <div class="stats-panel">
            <div class="stats-grid">
                <div class="stat-badge">⏰ <span id="stat-time">06:00</span></div>
                <div class="stat-badge">📍 <span id="stat-loc">—</span></div>
                <div class="stat-badge">🎭 <span id="stat-state">—</span></div>

            <div class="relato-box" id="relato-label">Relato: <em id="relato-name">—</em></div>
        </div>

        <div class="story-box">
            <div class="story-text" id="story-text">
                <p>Cargando...</p>
            </div>
            <div class="choices" id="choices"></div>
        </div>
    </div>

    <!-- Panel de mandos -->
    <div class="gamepad">
        <div class="system-bar">
            <button class="sys-btn" id="btn-save" onclick="saveGame()">💾 GUARDAR</button>
            <button class="sys-btn" id="btn-load" onclick="loadGame()">📀 CARGAR</button>
            <button class="sys-btn" onclick="restartGame()">🔄 REINICIAR</button>

        <div>
            <p style="color:#3e5060;font-size:0.7rem;margin-bottom:6px">📜 Registro de eventos</p>
            <div class="event-log" id="event-log"></div>
        </div>
    </div>

</div>

<div class="toast" id="toast"></div>

// ---------------------------------------------------------------------------
// GAME STATE
// ---------------------------------------------------------------------------

let state = {
    scene: "intro",
    visited: [],
    log: []
};

// ---------------------------------------------------------------------------
// RENDERING
// ---------------------------------------------------------------------------

function render() {
    const scene = SCENES[state.scene];
    if (!scene) return;

    // Stats
    document.getElementById("stat-time").textContent = scene.time;
    document.getElementById("stat-loc").textContent = scene.loc;
    document.getElementById("stat-state").textContent = scene.state;
    document.getElementById("relato-name").textContent = scene.relato;

    // Story text
    const storyEl = document.getElementById("story-text");
    storyEl.innerHTML = "";
    for (const item of scene.text) {
        if (typeof item === "string") {
            const p = document.createElement("p");
            p.textContent = item;
            storyEl.appendChild(p);
        } else if (item.type === "dialogue") {
            const div = document.createElement("div");
            div.className = "dialogue";
            div.textContent = item.text;
            storyEl.appendChild(div);
        } else if (item.type === "ending") {
            const div = document.createElement("div");
            div.className = "ending-tag";
            div.textContent = item.text;
            storyEl.appendChild(div);
        }
    }

    // Choices
    const choicesEl = document.getElementById("choices");
    choicesEl.innerHTML = "";
    for (const choice of scene.choices) {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = choice.text;
        btn.onclick = () => choose(choice);
        choicesEl.appendChild(btn);
    }

    // Event log
    const logEl = document.getElementById("event-log");
    logEl.innerHTML = state.log.slice(-30).map(e => `<div>${e}</div>`).join("");
    logEl.scrollTop = logEl.scrollHeight;
}

// ---------------------------------------------------------------------------
// GAME LOGIC
// ---------------------------------------------------------------------------

function choose(choice) {
    const scene = SCENES[state.scene];
    logEvent(`${scene.loc} → ${choice.text.replace(/^[\u{1F000}-\u{1FFFF}\u{2600}-\u{26FF}⬆↩⛔⛽★🔄🔵🎯📸📷👁🔍🌀🌅🌑🗺🎭🏛🗿🚗] /u, "").trim()}`);

    if (!state.visited.includes(state.scene)) {
        state.visited.push(state.scene);
    }

    state.scene = choice.next;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function logEvent(msg) {
    const now = new Date().toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });
    state.log.push(`[${now}] ${msg}`);
}

// ---------------------------------------------------------------------------
// SAVE / LOAD / RESTART
// ---------------------------------------------------------------------------

function saveGame() {
    try {
        localStorage.setItem("eljuego_save", JSON.stringify(state));
        showToast("💾 Partida guardada");
        logEvent("Partida guardada");
        render();
    } catch (e) {
        showToast("⚠ No se pudo guardar");
    }
}

function loadGame() {
    try {
        const raw = localStorage.getItem("eljuego_save");
        if (!raw) { showToast("📀 No hay partida guardada"); return; }
        state = JSON.parse(raw);
        showToast("📀 Partida cargada");
        logEvent("Partida cargada");
        render();
    } catch (e) {
        showToast("⚠ Error al cargar");
    }
}

function restartGame() {
    if (!confirm("¿Reiniciar la partida desde el principio?")) return;
    state = { scene: "intro", visited: [], log: [] };
    logEvent("Partida reiniciada");
    showToast("🔄 Reiniciando...");
    render();
}

// ---------------------------------------------------------------------------
// TOAST
// ---------------------------------------------------------------------------

let toastTimer = null;
function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
}

// ---------------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------------

logEvent("El juego ha comenzado");
render();
</script>
</body>
</html>
